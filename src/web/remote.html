<div class=top><svg class=mark viewBox="0 0 30 30"><rect width=30 height=30 rx=8 fill="#d97757"/><rect x=6 y=7 width=18 height=12 rx=4 fill="#fff7f0"/><path d="M10 19v5l5-5z" fill="#fff7f0"/><circle cx=11 cy=13 r=1.6 fill="#d97757"/><circle cx=15 cy=13 r=1.6 fill="#d97757"/><circle cx=19 cy=13 r=1.6 fill="#d97757"/></svg>
<div class=name>Claude</div><button class=ib id=nb>New chat</button><a class=ib href=/settings>Settings</a></div>
<div class=wrap><div id=hello class=hello><svg class=mark style="width:48px;height:48px" viewBox="0 0 30 30"><rect width=30 height=30 rx=8 fill="#d97757"/><rect x=6 y=7 width=18 height=12 rx=4 fill="#fff7f0"/><path d="M10 19v5l5-5z" fill="#fff7f0"/><circle cx=11 cy=13 r=1.6 fill="#d97757"/><circle cx=15 cy=13 r=1.6 fill="#d97757"/><circle cx=19 cy=13 r=1.6 fill="#d97757"/></svg>
<h2 id=greet>Hello</h2><p>Chatting through your PS4.</p></div><div id=log></div><div id=think class=think style="display:none"><i></i><i></i><i></i>&nbsp;Thinking</div></div>
<div class=dock><div class=comp><textarea id=t rows=1 placeholder="Reply to Claude..."></textarea>
<div class=row><select class=sel id=ms aria-label=Model></select><select class=sel id=es aria-label=Effort></select><span class=sp></span>
<button class=go id=go aria-label=Send><svg width=18 height=18 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2.4 stroke-linecap=round stroke-linejoin=round><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></div>
<div class=st id=st>Connecting...</div></div>
<div class=modal id=cf><div class=card><h3>Allow this action?</h3><pre id=cft></pre><div class=row>
<button class="btn pri" id=ya>Allow</button><button class="btn sec" id=na>Deny</button></div></div></div>
<script>
var n=0,g=-1,busy=0,ready=0,bridge=-1,cur={},$=function(i){return document.getElementById(i)},log=$('log');
var M={api:[["claude-opus-5-5","Opus 5.5"],["claude-sonnet-5-5","Sonnet 5.5"],["claude-haiku-5-5","Haiku 5.5"],["claude-fable-5-2","Fable 5.2"],["claude-opus-5","Opus 5"]],
br:[["default","PC default"],["opus","Opus"],["sonnet","Sonnet"],["haiku","Haiku"],["fable","Fable"]]};
var E=[["","Default effort"],["low","Low effort"],["medium","Medium effort"],["high","High effort"],["xhigh","Extra high effort"],["max","Max effort"]];
var h=new Date().getHours();$('greet').textContent=h<5?'Up late?':h<12?'Good morning':h<18?'Good afternoon':'Good evening';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function inl(s){return s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')}
function md(src){var L=esc(src).split('\n'),o='',i=0,lst='',para=[];
function fp(){if(para.length){o+='<p>'+inl(para.join('<br>'))+'</p>';para=[]}}
function fl(){if(lst){o+='</'+lst+'>';lst=''}}
for(;i<L.length;i++){var l=L[i],m;
if(/^\s*```/.test(l)){fp();fl();var c=[];for(i++;i<L.length&&!/^\s*```/.test(L[i]);i++)c.push(L[i]);o+='<pre><code>'+c.join('\n')+'</code></pre>';continue}
if(!l.trim()){fp();fl();continue}
if(m=l.match(/^(#{1,6})\s+(.*)/)){fp();fl();var k=Math.min(m[1].length,3);o+='<h'+k+'>'+inl(m[2])+'</h'+k+'>';continue}
if(/^\s*([-*_])\1\1\s*$/.test(l)){fp();fl();o+='<hr>';continue}
if(m=l.match(/^\s*[-*+]\s+(.*)/)){fp();if(lst!='ul'){fl();o+='<ul>';lst='ul'}o+='<li>'+inl(m[1])+'</li>';continue}
if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){fp();if(lst!='ol'){fl();o+='<ol>';lst='ol'}o+='<li>'+inl(m[1])+'</li>';continue}
if(m=l.match(/^&gt;\s?(.*)/)){fp();fl();o+='<blockquote>'+inl(m[1])+'</blockquote>';continue}
fl();para.push(l)}
fp();fl();return o}
function opts(sel,list,val){var h='',f=0;list.forEach(function(x){if(x[0]==val)f=1;h+='<option value="'+x[0]+'"'+(x[0]==val?' selected':'')+'>'+x[1]+'</option>'});
if(!f)h+='<option value="'+esc(val)+'" selected>'+esc(val)+'</option>';sel.innerHTML=h}
function post(u,b){return fetch(u,{method:'POST',headers:{'X-Claude-Remote':'1','Content-Type':'text/plain'},body:b})
.then(function(r){if(r.status==401)location.reload();return r.json()}).then(function(j){if(j&&j.error)alert(j.error);poll()}).catch(function(){})}
function send(){if(busy){post('/api/stop','');return}var t=$('t');if(!t.value.trim())return;post('/api/send',t.value);t.value='';grow()}
function grow(){var t=$('t');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px'}
function setm(){post('/api/model','model='+encodeURIComponent($('ms').value)+'&effort='+encodeURIComponent($('es').value))}
$('go').onclick=send;$('t').oninput=grow;$('ms').onchange=setm;$('es').onchange=setm;
$('t').onkeydown=function(e){if(e.key=='Enter'&&!e.shiftKey&&window.innerWidth>700){e.preventDefault();send()}};
$('nb').onclick=function(){if(confirm('Start a new chat?'))post('/api/new','')};
$('ya').onclick=function(){post('/api/confirm','yes')};$('na').onclick=function(){post('/api/confirm','no')};
var SEND='<svg width=18 height=18 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2.4 stroke-linecap=round stroke-linejoin=round><path d="M12 19V5M5 12l7-7 7 7"/></svg>',STOP='<svg width=14 height=14 viewBox="0 0 14 14"><rect width=14 height=14 rx=3 fill=currentColor /></svg>';
function poll(){fetch('/api/state?n='+n+'&g='+g).then(function(r){if(r.status==401){location.reload();return}return r.json()})
.then(function(j){if(!j)return;if(j.gen!=g){g=j.gen;n=0;log.innerHTML=''}
var atEnd=window.innerHeight+window.scrollY>=document.body.scrollHeight-80;
for(var i=0;i<j.msgs.length;i++){var k=j.from+i,d=log.children[k],x=j.msgs[i];if(!d){d=document.createElement('div');log.appendChild(d)}
if(d._t===x.t&&d._r===x.r)continue;d._t=x.t;d._r=x.r;d.className='m '+x.r;if(x.r=='a')d.innerHTML=md(x.t);else d.textContent=x.t}
n=j.count;busy=j.busy;ready=j.ready;$('hello').style.display=j.count?'none':'block';
$('think').style.display=j.busy&&(!j.msgs.length||j.msgs[j.msgs.length-1].r!='a')&&j.confirm===null?'flex':'none';
if(bridge!==j.bridge||cur.m!==j.model||cur.e!==j.effort){bridge=j.bridge;cur={m:j.model,e:j.effort};opts($('ms'),j.bridge?M.br:M.api,j.model);opts($('es'),E,j.effort)}
$('st').textContent=!j.ready?'Not set up yet: open Settings.':j.bridge?'Through your PC bridge':'Through your PS4, console tools on';
var go=$('go');go.disabled=!j.ready;go.className=busy?'go stop':'go';go.innerHTML=busy?STOP:SEND;go.setAttribute('aria-label',busy?'Stop':'Send');
var cf=$('cf');if(j.confirm!==null){cf.style.display='flex';$('cft').textContent=j.confirm}else cf.style.display='none';
if(atEnd&&j.msgs.length)window.scrollTo(0,document.body.scrollHeight)})
.catch(function(){$('st').textContent='PS4 not reachable'})}
poll();setInterval(poll,1000);
</script></body></html>
